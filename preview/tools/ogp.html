<!-- OGP画像（1200×630）の元データ。ブラウザで 1200×630 の表示サイズにして撮影し、preview/ogp.png に保存する -->
<!doctype html><html lang="ja"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{width:1200px;height:630px;background:#fbfaf7;color:#141414;font-family:'Zen Kaku Gothic New',sans-serif;overflow:hidden;display:grid;place-content:center;text-align:center}
h1{font-family:'Dela Gothic One',sans-serif;font-weight:400;font-size:168px;line-height:1;white-space:nowrap;transform:translateX(5px)}
h1 span{color:#d6337f;font-size:1.22em;text-shadow:10px 10px 0 #2fbfc4}
.sub{margin-top:36px;font-weight:900;font-size:46px;letter-spacing:.08em}
.foot{position:fixed;left:0;right:0;bottom:0;height:10px;display:grid;grid-template-columns:repeat(4,1fr)}
.foot i:nth-child(1){background:#e2408f}.foot i:nth-child(2){background:#2fbfc4}.foot i:nth-child(3){background:#8b6fd6}.foot i:nth-child(4){background:#c9a03f}
</style></head><body>
<h1>メタル<span>脳</span></h1>
<p class="sub">オパビのイヤホン帳</p>
<div class="foot"><i></i><i></i><i></i><i></i></div>
</body></html>
